name: oh_tai_gi
description: A Taiwanese (tâi-gí) learning app.
publish_to: 'none'

# The following defines the version and build number for your application.
# In Android, build-name is used as versionName while build-number used as versionCode.
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
version: 1.1.0+23

environment:
  sdk: ^3.10.0

# Lines marked with `# NONFREE` are removed by `scripts/make_foss.sh` for the
# F-Droid build, together with lib/services/*_foss.dart replacing the real
# service implementations.
dependencies:
  flutter:
    sdk: flutter

  audioplayers: ^6.8.1
  connectivity_plus: ^7.3.2
  feature_discovery: ^0.14.2
  http: ^1.6.0
  path: ^1.9.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5
  youtube_player_flutter: ^10.0.1

  firebase_analytics: ^13.0.1 # NONFREE
  firebase_core: ^5.1.0 # NONFREE
  firebase_crashlytics: ^6.0.1 # NONFREE
  google_mobile_ads: ^9.2.0 # NONFREE

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true

  assets:
    - assets/dict/dict-twblg-merge.json
    - assets/dict/dict-list.json
    - assets/dict/dict-ref.json
    - assets/audio/win.wav
    - assets/audio/correct.wav
    - assets/launcher/icon_pos.png
    - assets/launcher/icon_neg.png
    - assets/launcher/icon_tired.png

  fonts:
    - family: huninn
      fonts:
        - asset: assets/fonts/jf-openhuninn-1.0.ttf
    - family: MOEDICT
      fonts:
        - asset: assets/fonts/MOEDICT.ttf
