# Proposed `Builds:` entry for fdroiddata
# (metadata/com.gonnaggstudio.oh_tai_gi.yml) once 1.1.0 is tagged.
# The long sed chain of the 1.0.21 recipe is replaced by scripts/make_foss.sh.
  - versionName: 1.1.0
    versionCode: 23
    commit: v1.1.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.9
    rm:
      - ios
      - server
    prebuild:
      - scripts/make_foss.sh
      - echo "flutter.sdk=$$flutter$$" >> android/local.properties
    build:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/flutter build apk --release
